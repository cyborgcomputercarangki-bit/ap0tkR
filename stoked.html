<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Management System - Apotek Sejahtera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; color: #1e293b; }
        .luxury-card { background: white; border-radius: 1rem; border: 1px solid #e2e8f0; transition: all 0.3s; }
        .luxury-card:hover { border-color: #cbd5e1; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <i class="fas fa-boxes-stacked text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-black text-sm uppercase tracking-wide">Apotek Sejahtera</h1>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Manajemen Inventaris & Obat</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-xl text-center">
                    <span class="text-[9px] font-bold text-slate-400 block uppercase">Total Produk</span>
                    <span id="total-produk-count" class="font-black text-sm text-blue-400">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1">
                <div class="luxury-card p-6 shadow-md sticky top-24 border-t-4 border-blue-600 h-fit max-h-[calc(100vh-120px)] overflow-y-auto custom-scroll">
                    <div class="flex items-center gap-3 mb-6">
                        <i class="fas fa-file-pen text-blue-600 text-xl"></i>
                        <h2 id="form-title" class="font-black uppercase text-sm text-slate-800">Tambah Obat Baru</h2>
                    </div>
                    
                    <div class="space-y-4">
                        <input type="hidden" id="prod-id">
                        
                        <div class="flex flex-col items-center justify-center border-2 border-dashed border-slate-200 rounded-xl p-3 bg-slate-50 relative">
                            <img id="img-preview" src="" class="hidden w-24 h-24 object-cover rounded-lg mb-2 border">
                            <div id="img-placeholder" class="text-center py-4 text-slate-400">
                                <i class="fas fa-image text-3xl mb-1 block"></i>
                                <span class="text-[9px] font-bold uppercase block">Belum Ada Gambar</span>
                            </div>
                            <label class="cursor-pointer bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase transition-all">
                                <i class="fas fa-camera mr-1"></i> Pilih Gambar
                                <input type="file" id="prod-image-file" accept="image/*" onchange="previewAndConvertImage(this)" class="hidden">
                            </label>
                            <input type="hidden" id="prod-image-base64">
                        </div>

                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Nama Obat</label>
                            <input type="text" id="prod-nama" class="w-full p-3 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:border-blue-500">
                        </div>
                        
                        <div class="grid grid-cols-3 gap-3">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Kategori</label>
                                <select id="prod-kat" class="w-full p-3 bg-slate-50 border rounded-xl font-bold text-xs">
                                    <option value="GENERIK">GENERIK</option>
                                    <option value="ANALGESIK">ANALGESIK</option>
                                    <option value="SYRUP">SYRUP</option>
                                    <option value="KERAS">OBAT KERAS</option>
                                    <option value="VITAMIN">VITAMIN</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Stok</label>
                                <input type="number" id="prod-stok" class="w-full p-3 bg-slate-50 border rounded-xl font-bold text-sm">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">No. Batch</label>
                                <input type="text" id="prod-batch" placeholder="Otomatis" class="w-full p-3 bg-slate-50 border rounded-xl font-bold text-xs uppercase outline-none focus:border-blue-500">
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Harga Jual</label>
                                <input type="text" id="prod-harga" onkeyup="formatCurrency(this)" class="w-full p-3 bg-slate-50 border rounded-xl font-bold text-sm">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Exp Date</label>
                                <input type="date" id="prod-exp" class="w-full p-3 bg-slate-50 border rounded-xl font-bold text-sm">
                            </div>
                        </div>
                        
                        <div class="pt-2 flex gap-2">
                            <button onclick="saveProductData()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-xl font-black uppercase text-[10px] shadow-md transition-all">Simpan Obat</button>
                            <button onclick="clearForm()" class="bg-slate-200 text-slate-600 px-4 rounded-xl hover:bg-slate-300 transition-all"><i class="fas fa-sync-alt"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-4">
                <div class="luxury-card p-4 flex items-center gap-4 shadow-sm">
                    <i class="fas fa-search text-slate-400 ml-2"></i>
                    <input type="text" id="search-inventory" oninput="searchProductTable(this.value)" placeholder="Cari berdasarkan nama atau nomor batch obat..." class="w-full outline-none font-bold text-sm bg-transparent">
                </div>
                
                <div class="luxury-card overflow-hidden shadow-md">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-900 text-white text-[10px] font-black uppercase tracking-wider">
                                <tr>
                                    <th class="p-4 w-16 text-center">Gambar</th>
                                    <th class="p-4">Detail Obat</th>
                                    <th class="p-4 text-center">Stok</th>
                                    <th class="p-4">Harga Jual</th>
                                    <th class="p-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-table-body" class="divide-y text-xs font-bold text-slate-600 bg-white">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <script>
         // --- CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyCfi8bqVns9WvdrbTMVcJkYcKn-w1lX-Go",
            authDomain: "ap0tik-reny.firebaseapp.com",
            projectId: "ap0tik-reny",
            databaseURL: "https://ap0tik-reny-default-rtdb.asia-southeast1.firebasedatabase.app/", 
            storageBucket: "ap0tik-reny.firebasestorage.app"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let inventoryData = {};

        // Ambil Data Realtime dari Node 'obat'
        db.ref('obat').on('value', snapshot => {
            inventoryData = snapshot.val() || {};
            renderInventoryTable();
        });

        // Konversi & Preview Gambar ke Base64
        function previewAndConvertImage(input) {
            const file = input.files[0];
            if (!file) return;

            // Validasi ukuran file (Saran: maksimal 500KB agar database tetap ringan)
            if (file.size > 500 * 1024) {
                Swal.fire('File Terlalu Besar', 'Maksimal ukuran gambar adalah 500KB agar performa database lancar.', 'warning');
                input.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64String = e.target.result;
                document.getElementById('prod-image-base64').value = base64String;
                
                const preview = document.getElementById('img-preview');
                preview.src = base64String;
                preview.classList.remove('hidden');
                document.getElementById('img-placeholder').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        // Render Tabel Utama
        function renderInventoryTable() {
            const tbody = document.getElementById('inventory-table-body');
            tbody.innerHTML = '';
            
            const keys = Object.keys(inventoryData);
            let total = 0;

            keys.forEach(id => {
                const item = inventoryData[id];
                if (!item || typeof item !== 'object') return;

                const nama = item.nama || 'Tanpa Nama';
                const kat = item.kategori || 'GENERIK';
                const stok = Number(item.stok) || 0;
                const harga = Number(item.harga_biji) || 0;
                const exp = item.expired || '-';
                const batch = item.no_batch || '-';
                const img = item.gambar || ''; // Ambil string base64 gambar

                const row = document.createElement('tr');
                row.className = 'inventory-row hover:bg-slate-50 transition-colors';
                row.setAttribute('data-search', nama.toLowerCase() + ' ' + batch.toLowerCase());

                // Thumbnail Gambar Konten
                const imageTag = img 
                    ? `<img src="${img}" class="w-10 h-10 object-cover rounded-lg border shadow-sm mx-auto">` 
                    : `<div class="w-10 h-10 bg-slate-100 rounded-lg flex items-center justify-center border text-slate-300 mx-auto"><i class="fas fa-pills text-xs"></i></div>`;

                row.innerHTML = `
                    <td class="p-4">${imageTag}</td>
                    <td class="p-4">
                        <div class="font-black uppercase text-[11px] text-slate-800">${nama}</div>
                        <div class="text-[9px] text-slate-400 uppercase mt-0.5">${kat} | <span class="text-amber-600 font-bold">Batch: ${batch}</span> | Exp: ${exp}</div>
                    </td>
                    <td class="p-4 text-center">
                        <span class="px-2 py-1 rounded-md ${stok < 5 ? 'bg-red-100 text-red-600' : 'bg-slate-100 text-slate-700'}">${stok}</span>
                    </td>
                    <td class="p-4 text-blue-600 font-extrabold">Rp ${harga.toLocaleString('id-ID')}</td>
                    <td class="p-4">
                        <div class="flex justify-center gap-1.5">
                            <button onclick="loadToForm('${id}')" class="w-8 h-8 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center hover:bg-amber-500 hover:text-white transition-all"><i class="fas fa-edit text-[10px]"></i></button>
                            <button onclick="deleteProductData('${id}')" class="w-8 h-8 rounded-lg bg-red-100 text-red-600 flex items-center justify-center hover:bg-red-500 hover:text-white transition-all"><i class="fas fa-trash text-[10px]"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
                total++;
            });

            document.getElementById('total-produk-count').innerText = total;
        }

        // Simpan / Update Data
     async function saveProductData() {
            const idInput = document.getElementById('prod-id').value;
            const nama = document.getElementById('prod-nama').value.trim();
            if (!nama) return Swal.fire('Gagal', 'Nama obat wajib diisi!', 'error');

            // Ambil nilai batch dari input, hapus spasi di ujung, dan ubah ke huruf kapital
            let batchValue = document.getElementById('prod-batch').value.trim().toUpperCase();
            
            // Logika kaku: jika dikosongkan oleh user, simpan sebagai '-', JANGAN generate otomatis
            if (!batchValue) {
                batchValue = '-';
            }

            const id = idInput || nama.toLowerCase().replace(/\s+/g, '-');
            
            const data = {
                nama: nama,
                kategori: document.getElementById('prod-kat').value,
                stok: parseInt(document.getElementById('prod-stok').value) || 0,
                harga_biji: parseInt(document.getElementById('prod-harga').value.replace(/\D/g, '')) || 0,
                expired: document.getElementById('prod-exp').value,
                no_batch: batchValue,
                gambar: document.getElementById('prod-image-base64').value // Menyimpan base64 ke database
            };

            await db.ref('obat/' + id).update(data);
            
            // PERBAIKAN: Swal.fire otomatis hilang dalam 1.2 detik tanpa tombol OK
            Swal.fire({
                icon: 'success',
                title: 'Berhasil',
                text: 'Data produk berhasil diperbarui!',
                showConfirmButton: false,
                timer: 1200 // Hilang otomatis dalam 1.2 detik
            });

            clearForm();
        }

        // Load Data ke Form untuk Edit
       function loadToForm(id) {
            const item = inventoryData[id];
            if (!item) return;

            document.getElementById('prod-id').value = id;
            document.getElementById('prod-nama').value = item.nama || '';
            document.getElementById('prod-kat').value = item.kategori || 'GENERIK';
            document.getElementById('prod-stok').value = item.stok || 0;
            document.getElementById('prod-harga').value = (item.harga_biji || 0).toLocaleString('id-ID');
            document.getElementById('prod-exp').value = item.expired || '';
            
            // PERBAIKAN BATCH: Jika nilainya '-', kosongkan input biar bersih saat diedit
            document.getElementById('prod-batch').value = (item.no_batch && item.no_batch !== '-') ? item.no_batch : '';
            
            // Atur gambar preview saat edit
            const preview = document.getElementById('img-preview');
            const placeholder = document.getElementById('img-placeholder');
            if (item.gambar) {
                document.getElementById('prod-image-base64').value = item.gambar;
                preview.src = item.gambar;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                document.getElementById('prod-image-base64').value = '';
                preview.src = '';
                preview.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }

            document.getElementById('form-title').innerText = "Edit Obat: " + item.nama;
            
            // PERBAIKAN UTAMA: Perintah window.scrollTo ke atas sudah DIHAPUS total di sini!
        }

        // Hapus Data Obat
        async function deleteProductData(id) {
            const result = await Swal.fire({
                title: 'Hapus Permanen?',
                text: `Data obat "${inventoryData[id].nama}" akan dihapus selamanya dari sistem.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Ya, Hapus!'
            });

            if (result.isConfirmed) {
                await db.ref('obat/' + id).remove();
                Swal.fire('Dihapus', 'Obat telah dihapus dari inventaris.', 'success');
            }
        }

        // Realtime Filter Pencarian
        function searchProductTable(val) {
            const query = val.toLowerCase();
            document.querySelectorAll('.inventory-row').forEach(row => {
                row.style.display = row.getAttribute('data-search').includes(query) ? '' : 'none';
            });
        }

        // Clear & Reset Form
        function clearForm() {
            document.getElementById('prod-id').value = '';
            document.getElementById('prod-nama').value = '';
            document.getElementById('prod-stok').value = '';
            document.getElementById('prod-harga').value = '';
            document.getElementById('prod-exp').value = '';
            document.getElementById('prod-batch').value = '';
            document.getElementById('prod-image-base64').value = '';
            document.getElementById('prod-image-file').value = '';
            
            document.getElementById('img-preview').src = '';
            document.getElementById('img-preview').classList.add('hidden');
            document.getElementById('img-placeholder').classList.remove('hidden');
            
            document.getElementById('form-title').innerText = "Tambah Obat Baru";
        }

        // Helper Format Rupiah
        function formatCurrency(input) {
            let val = input.value.replace(/\D/g, '');
            input.value = val ? Number(val).toLocaleString('id-ID') : '';
        }
    </script>
</body>
</html>
